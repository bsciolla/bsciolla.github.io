<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>Le jeu</title>
        <meta name="author" content="Bruno Sciolla">
        <meta name="description" content="C'est le jeu ma pauvre Lucette !!!">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div>
            <h1>Bruno's pastime</h1>
            <input type="number" value="26" id="numberOfSortsInput"></input>
            <button onclick="reloadMap()">Reload</button>
            <button onclick="togglePause()" id="pauseButton">Pause</button>
            <label for="blockDamageInput">Block damage</label>
            <input type="number" value="20" id="blockDamageInput" oninput="updateBlockDamage()"></input>
            <label for="animationDurationFactorInput">Animation duration %</label>
            <input type="number" value="100" id="animationDurationFactorInput" oninput="updateAnimationDurationFactor()"></input>
        </div>
        <div>
            <canvas id="canvas1">game</canvas>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
        <script src="doc.js"></script>
    </body>
</html>
