<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>Le jeu</title>
        <meta name="author" content="Bruno Sciolla">
        <meta name="description" content="C'est le jeu ma pauvre Lucette !!!">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div>
            <h1>Bruno's pastime</h1>
            <input type="number" value="16" id="numberOfSortsInput"></input>
            <button onclick="reloadMap()">Reload</button>
            <button onclick="togglePause()" id="pauseButton">Pause</button>
            <button onclick="toggleRandomMode()" id="randomModeButton">Random Mode: Off</button>
            <button onclick="toggleTheme()" id="themeButton">Theme: Colorlight</button>
            <label for="blockDamageInput">Block damage</label>
            <input type="number" value="40" id="blockDamageInput" oninput="updateBlockDamage()"></input>
            <label for="animationDurationFactorInput">Animation duration %</label>
            <input type="number" value="100" id="animationDurationFactorInput" oninput="updateAnimationDurationFactor()"></input>
            <label for="scenarioSelect">Scenario</label>
            <select id="scenarioSelect" onchange="updateScenario()"></select>
        </div>
        <div id="congratsMessage" onclick="this.style.display='none'" style="display:none; cursor: pointer; position: fixed; top: 50%; left: 0; right: 0; transform: translateY(-50%); background: white; color: green; font-weight: bold; font-size: 3em; text-align: center; padding: 20px 0; z-index: 1000; box-shadow: 0 0 20px rgba(0,0,0,0.3);"></div>
        <div>
            <canvas id="canvas1">game</canvas>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
        <script src="doc.js"></script>
    </body>
</html>
